<section class="portfolio-grid" aria-labelledby="portfolio-holdings-title">
  <div class="portfolio-grid__heading">
    <div>
      <p class="portfolio-grid__eyebrow">Portfolio / Holdings</p>
      <h2 id="portfolio-holdings-title">Portfolio Holdings</h2>
      <p>Posizioni multiasset con quotazioni simulate. Aggiungi uno strumento o modifica Quantity per ricalcolare Value e P/L.</p>
    </div>
    <div class="portfolio-grid__market">
      <span class="portfolio-grid__simulated" [class.is-paused]="!live()"><span class="portfolio-grid__status-dot" aria-hidden="true"></span>Simulated live market · EUR</span>
      <button class="portfolio-grid__pause" type="button" (click)="toggleMarket()" [attr.aria-label]="live() ? 'Metti in pausa il mercato simulato' : 'Riprendi il mercato simulato'">{{ live() ? 'Pause' : 'Resume' }}</button>
      <button class="portfolio-grid__add" type="button" (click)="addPosition()">Add Position</button>
    </div>
  </div>
  @if (lookupError()) {
    <p class="portfolio-grid__error" role="alert">{{ lookupError() }}</p>
  }
  <div class="portfolio-grid__scroll" role="region" aria-label="Portfolio Holdings, scorri orizzontalmente per altre colonne" tabindex="0">
    <div #gridHost class="portfolio-grid__table"></div>
  </div>
</section>
