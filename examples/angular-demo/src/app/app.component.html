<main class="portfolio-page">
  <header class="portfolio-hero" aria-labelledby="hero-title">
    <div class="portfolio-hero__brand">
      <img src="assets/amb-grid-logo.png" alt="AMB Grid" width="450" height="70" />
      <span class="portfolio-hero__edition">Angular edition</span>
    </div>

    <div class="portfolio-hero__content">
      <p class="portfolio-hero__eyebrow">Portfolio concept <span aria-hidden="true"></span> Angular 22</p>
      <h1 id="hero-title">Live Multi-Asset <span>Portfolio</span></h1>
      <p class="portfolio-hero__description">
        Una demo per un portfolio finanziario simulato, costruita con Angular e AMB Grid.
      </p>

      <div class="portfolio-hero__details">
        <div class="portfolio-hero__detail">
          <span class="portfolio-hero__detail-label">Asset universe</span>
          <ul class="portfolio-hero__assets" aria-label="Categorie previste">
            <li>Stocks</li>
            <li>ETF</li>
            <li>Bonds</li>
            <li>Crypto</li>
          </ul>
        </div>
        <div class="portfolio-hero__detail">
          <span class="portfolio-hero__detail-label">Built with</span>
          <p class="portfolio-hero__stack">Angular <span>+</span> TypeScript <span>+</span> AMB Grid</p>
        </div>
      </div>
    </div>

    <a
      class="video-preview"
      href="https://www.youtube.com/watch?v=2qhXHt0Upps"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Apri la demo video di AMB Grid su YouTube (nuova scheda)"
    >
      <span class="video-preview__media">
        <img
          class="video-preview__image"
          src="https://i.ytimg.com/vi/2qhXHt0Upps/hqdefault.jpg"
          alt=""
          loading="eager"
        />
        <span class="video-preview__play" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" focusable="false" aria-hidden="true">
            <path d="M8 5.5v13l10-6.5z" />
          </svg>
        </span>
      </span>
      <span class="video-preview__footer">
        <span class="video-preview__caption">
          <span class="video-preview__caption-kicker">Video overview</span>
          <span class="video-preview__caption-title">AMB Grid demo</span>
        </span>
        <span class="video-preview__destination">YouTube <span aria-hidden="true">↗</span></span>
      </span>
    </a>
  </header>
  <app-portfolio-grid />
</main>
