name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/react-demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install React demo dependencies
        run: npm ci --prefix examples/react-demo --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Run TypeScript type tests
        run: npm run test:types

      - name: Build library package
        run: npm run build:lib

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/react-demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build AMB Grid distribution
        run: npm run build:dist

      - name: Install React demo dependencies
        run: npm ci --prefix examples/react-demo --ignore-scripts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chrome

      - name: Run Playwright E2E tests
        run: npm run test:e2e -- --workers=1
