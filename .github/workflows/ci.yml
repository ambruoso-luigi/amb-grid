name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/react-demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install React demo dependencies
        run: npm ci --prefix examples/react-demo --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Run TypeScript type tests
        run: npm run test:types

      - name: Build library package
        if: matrix.node-version == 22
        run: npm run build:lib

      - name: Build distribution
        if: matrix.node-version == 24
        run: npm run build:dist

      - name: Build
        run: npm run build

      - name: Check framework examples
        if: matrix.node-version == 24
        run: npm run examples:frameworks:check

      - name: Smoke test package
        if: matrix.node-version == 24
        run: npm run package:smoke

      - name: Check legacy package
        if: matrix.node-version == 24
        run: npm run legacy:package:check

      - name: Smoke test legacy bundle
        if: matrix.node-version == 24
        run: npm run legacy:smoke

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/react-demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build AMB Grid distribution
        run: npm run build:dist

      - name: Install React demo dependencies
        run: npm ci --prefix examples/react-demo --ignore-scripts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chrome

      - name: Run Playwright E2E tests
        run: npm run test:e2e -- --workers=1
