name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        id: version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version $tag_version does not match package.json version $package_version." >&2
            exit 1
          fi

          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "zip_path=release-artifacts/amb-grid-legacy-$package_version.zip" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Verify npm package
        run: npm run package:smoke

      - name: Generate and verify legacy ZIP
        run: npm run legacy:package:check

      - name: Verify standalone legacy bundle
        run: npm run legacy:smoke

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "${{ steps.version.outputs.zip_path }}"
          --verify-tag
          --generate-notes
          --title "AMB Grid ${{ github.ref_name }}"
